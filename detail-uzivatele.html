<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail uživatele</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
    <a href="zed.html" class="brand">SíťKo</a>
    <div class="nav-links">
        <a href="zed.html">Zeď</a>
        <a href="uzivatele.html">Uživatelé</a>
        <button class="btn-logout" onclick="odhlasit()">Odhlásit</button>
    </div>
</nav>
<div class="main">
    <div id="profil"></div>
    <div id="prispevky-sekce"></div>
    <div class="section-divider"></div>
    <div id="aktivita-sekce"></div>
</div>
<script>
    const API = 'http://localhost:3000';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';
    const h = () => ({ 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` });
    const fmt = d => new Date(d).toLocaleString('cs-CZ', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const ini = (j, p) => (j[0] + p[0]).toUpperCase();

    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) window.location.href = 'uzivatele.html';

    async function nacist() {
        const res = await fetch(`${API}/uzivatele/${id}`, { headers: h() });
        if (res.status === 401) { window.location.href = 'login.html'; return; }
        const u = await res.json();

        document.getElementById('profil').innerHTML = `
            <div class="profile-card">
                <div class="avatar big">${ini(u.jmeno, u.prijmeni)}</div>
                <div>
                    <div class="profile-name">${u.jmeno} ${u.prijmeni}</div>
                    <div class="profile-meta">${u.vek} let · ${u.pohlavi || ''}</div>
                    <div class="profile-meta">Člen od ${new Date(u.datum_registrace).toLocaleDateString('cs-CZ')}</div>
                </div>
            </div>`;

        const ps = document.getElementById('prispevky-sekce');
        ps.innerHTML = `<div class="section-label">Příspěvky (${u.prispevky.length})</div>`;
        if (u.prispevky.length === 0) {
            ps.innerHTML += '<p class="empty">Zatím žádné příspěvky.</p>';
        } else {
            u.prispevky.forEach(p => {
                ps.innerHTML += `
                    <div class="post-card">
                        <div class="post-title">${p.nadpis} <span class="like-badge">♥ ${p.pocet_laiku}</span></div>
                        <div class="post-text">${p.text}</div>
                        ${p.obrazek ? `<img src="${p.obrazek}" class="post-img">` : ''}
                        <div class="post-date">${fmt(p.datum_vytvoreni)}</div>
                    </div>`;
            });
        }

        const as = document.getElementById('aktivita-sekce');
        as.innerHTML = `<div class="section-label">Lajkoval / komentoval (${u.aktivita_na_cizich.length})</div>`;
        if (u.aktivita_na_cizich.length === 0) {
            as.innerHTML += '<p class="empty">Žádná aktivita.</p>';
        } else {
            u.aktivita_na_cizich.forEach(p => {
                as.innerHTML += `
                    <div class="post-card">
                        <div class="post-title">${p.nadpis}</div>
                        <div class="post-text">${p.text}</div>
                        <div class="post-date">od ${p.autor_jmeno} ${p.autor_prijmeni} · ${fmt(p.datum_vytvoreni)}</div>
                    </div>`;
            });
        }
    }

    function odhlasit() { localStorage.removeItem('token'); window.location.href = 'login.html'; }
    nacist();
</script>
</body>
</html>
