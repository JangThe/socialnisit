<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeď</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
    <a href="zed.html" class="brand">Síť</a>
    <div class="nav-links">
        <a href="zed.html" class="active">Zeď</a>
        <a href="uzivatele.html">Uživatelé</a>
        <button class="btn-logout" onclick="odhlasit()">Odhlásit</button>
    </div>
</nav>
<div class="main">
    <div class="post-form">
        <input type="text" id="nadpis" placeholder="Nadpis příspěvku">
        <textarea id="text" rows="3" placeholder="Co máš na srdci?"></textarea>
        <input type="text" id="obrazek" placeholder="URL obrázku (volitelné)">
        <button class="btn-post" onclick="pridatPrispevek()">Zveřejnit</button>
        <div style="clear:both"></div>
    </div>
    <div id="prispevky"></div>
</div>
<div class="modal-overlay" id="likeModal" onclick="if(event.target===this)this.classList.remove('show')">
    <div class="modal-box">
        <button class="btn-close-modal" onclick="document.getElementById('likeModal').classList.remove('show')">×</button>
        <h6>Lajkovali</h6>
        <div id="likeModalList"></div>
    </div>
</div>
<script>
    const API = 'http://localhost:3000';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';
    const h = () => ({ 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` });
    const fmt = d => new Date(d).toLocaleString('cs-CZ', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const ini = (j, p) => (j[0] + p[0]).toUpperCase();

    async function nacistPrispevky() {
        const res = await fetch(`${API}/prispevky`, { headers: h() });
        if (res.status === 401) { window.location.href = 'login.html'; return; }
        const data = await res.json();
        const c = document.getElementById('prispevky');
        c.innerHTML = '';
        data.forEach(p => {
            const div = document.createElement('div');
            div.className = 'post-card';
            div.innerHTML = `
                <div class="post-author">
                    <div class="avatar">${ini(p.jmeno, p.prijmeni)}</div>
                    <div>
                        <div class="author-name"><a href="detail-uzivatele.html?id=${p.autor_id}" style="color:var(--text);text-decoration:none">${p.jmeno} ${p.prijmeni}</a></div>
                        <div class="post-date">${fmt(p.datum_vytvoreni)}</div>
                    </div>
                </div>
                <div class="post-title">${p.nadpis}</div>
                <div class="post-text">${p.text}</div>
                ${p.obrazek ? `<img src="${p.obrazek}" class="post-img">` : ''}
                <div class="post-actions">
                    <button class="btn-like" id="like-btn-${p.id}" onclick="toggleLaik(${p.id})">♥ Lajk</button>
                    <span class="like-count" id="like-count-${p.id}" onclick="zobrazitLaiky(${p.id})">${p.pocet_laiku} lajků</span>
                    <button class="btn-comment" onclick="toggleKomentare(${p.id})">💬 Komentáře</button>
                </div>
                <div class="comments-section" id="comments-${p.id}">
                    <div id="comment-list-${p.id}"></div>
                    <div class="comment-input-wrap">
                        <input class="comment-input" id="comment-input-${p.id}" placeholder="Napiš komentář...">
                        <button class="btn-send" onclick="pridatKomentar(${p.id})">Odeslat</button>
                    </div>
                </div>`;
            c.appendChild(div);
        });
    }

    async function pridatPrispevek() {
        const nadpis = document.getElementById('nadpis').value;
        const text = document.getElementById('text').value;
        const obrazek = document.getElementById('obrazek').value;
        if (!nadpis || !text) return;
        await fetch(`${API}/prispevky`, { method: 'POST', headers: h(), body: JSON.stringify({ nadpis, text, obrazek: obrazek || null }) });
        document.getElementById('nadpis').value = '';
        document.getElementById('text').value = '';
        document.getElementById('obrazek').value = '';
        nacistPrispevky();
    }

    async function toggleLaik(id) {
        const btn = document.getElementById(`like-btn-${id}`);
        if (btn.classList.contains('liked')) {
            await fetch(`${API}/laiky/${id}`, { method: 'DELETE', headers: h() });
            btn.classList.remove('liked');
        } else {
            await fetch(`${API}/laiky`, { method: 'POST', headers: h(), body: JSON.stringify({ prispevek_id: id }) });
            btn.classList.add('liked');
        }
        const res = await fetch(`${API}/prispevky`, { headers: h() });
        const data = await res.json();
        const p = data.find(x => x.id === id);
        if (p) document.getElementById(`like-count-${id}`).textContent = `${p.pocet_laiku} lajků`;
    }

    async function zobrazitLaiky(id) {
        const res = await fetch(`${API}/laiky/${id}`, { headers: h() });
        const data = await res.json();
        document.getElementById('likeModalList').innerHTML = data.length === 0
            ? '<div style="color:var(--muted)">Zatím nikdo.</div>'
            : data.map(u => `<div class="modal-item">${u.jmeno} ${u.prijmeni} <span style="color:var(--muted);font-size:0.78rem">${fmt(u.datum_udele)}</span></div>`).join('');
        document.getElementById('likeModal').classList.add('show');
    }

    async function toggleKomentare(id) {
        const s = document.getElementById(`comments-${id}`);
        if (s.style.display === 'block') { s.style.display = 'none'; return; }
        s.style.display = 'block';
        const res = await fetch(`${API}/prispevky/${id}`, { headers: h() });
        const data = await res.json();
        document.getElementById(`comment-list-${id}`).innerHTML = data.komentare.length === 0
            ? '<div style="color:var(--muted);font-size:0.85rem;padding:0.5rem 0">Zatím žádné komentáře.</div>'
            : data.komentare.map(k => `<div class="comment-item"><span class="comment-author">${k.jmeno} ${k.prijmeni}</span><span class="comment-date">${fmt(k.datum_vytvoreni)}</span><div>${k.text}</div></div>`).join('');
    }

    async function pridatKomentar(id) {
        const input = document.getElementById(`comment-input-${id}`);
        if (!input.value.trim()) return;
        await fetch(`${API}/komentare`, { method: 'POST', headers: h(), body: JSON.stringify({ prispevek_id: id, text: input.value }) });
        input.value = '';
        document.getElementById(`comments-${id}`).style.display = 'none';
        toggleKomentare(id);
    }

    function odhlasit() { localStorage.removeItem('token'); window.location.href = 'login.html'; }
    nacistPrispevky();
</script>
</body>
</html>
